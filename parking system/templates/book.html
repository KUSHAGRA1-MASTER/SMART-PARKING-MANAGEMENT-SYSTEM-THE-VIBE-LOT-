<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Parking Slot</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; background-color: #f4f6f9; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 8px; background: white; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="text"], input[type="tel"], select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-align: center; text-decoration: none; }
        .btn-submit { background-color: #2ecc71; color: white; }
        .btn-submit:hover { background-color: #27ae60; }
        .btn-cancel { background-color: #e74c3c; color: white; }
        .btn-cancel:hover { background-color: #c0392b; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 12px 15px; border-radius: 4px; margin-bottom: 20px; font-size: 0.95em; font-weight: bold; }
        .price-badge { font-size: 0.85em; color: #27ae60; font-weight: normal; margin-left: 5px; }
    </style>
</head>
<body>
    <h2>📝 Slot Booking Form</h2>

    {% if error %}
        <div class="alert-danger">
            ❌ {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/book">
        <div class="form-group">
            <label for="name">Driver's Name</label>
            <input type="text" id="name" name="name" required placeholder="John Doe">
        </div>
        
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required placeholder="1234567890" inputmode="numeric" maxlength="10">
        </div>
        
        <div class="form-group">
            <label for="vehicle">Vehicle Number Plate</label>
            <input type="text" id="vehicle" name="vehicle" required placeholder="DL3CA1234" style="text-transform: uppercase;" maxlength="13">
        </div>

        <!-- Vehicle Type Selection -->
        <div class="form-group">
            <label for="vehicle_type">Vehicle Type</label>
            <select id="vehicle_type" name="vehicle_type">
                <option value="Two-Wheeler">🏍️ Two-Wheeler (Lower Rate)</option>
                <option value="Four-Wheeler" selected>🚗 Four-Wheeler (Standard Rate)</option>
            </select>
        </div>

        <!-- Monthly Subscription Plan Selector -->
        <div class="form-group">
            <label for="plan_type">Parking Plan</label>
            <select id="plan_type" name="plan_type">
                <option value="hourly">⏱️ Pay-Per-Hour (Standard)</option>
                <option value="monthly">📅 Monthly Pass (₹300/mo for 2-Wheelers, ₹1000/mo for 4-Wheelers)</option>
            </select>
        </div>
        
        <div class="actions">
            <button type="submit" class="btn btn-submit">Confirm Booking</button>
            <a href="/" class="btn btn-cancel">Cancel</a>
        </div>
    </form>
</body>
</html>
